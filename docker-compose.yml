services:
  mysql:
    image: mysql:8.4
    container_name: mycash-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mycash
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mycash:
    image: mycash:1.0
    container_name: mycash-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mycash
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data: